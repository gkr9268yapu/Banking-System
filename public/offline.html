<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GKR Bank - Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: #d9d0f2;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1c1c24;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            box-sizing: border-box;
            text-align: center;
            background: #fff;
            border-radius: 24px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #6b6b78;
        }

        button {
            margin-top: 24px;
            padding: 12px 24px;
            border: 0;
            border-radius: 12px;
            background: #1c1c24;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <main>
        <h1>You are offline</h1>
        <p>GKR Bank needs an internet connection. Your money was not touched. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>

</html>
